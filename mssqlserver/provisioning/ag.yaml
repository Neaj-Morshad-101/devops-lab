apiVersion: kubedb.com/v1alpha2
kind: MSSQLServer
metadata:
  name: ag
  namespace: demo
spec:
  version: "2025-cu0"
  replicas: 3
  # authSecret:
  #   name: mssql-auth
  #   externallyManaged: true
  # configSecret:
  #   name: ms-custom-config
  # configuration:
  #   secretName: ms-custom-config
  #   inline:
  #     mssql.conf: |-
  #       [memory]
  #       memorylimitmb = 2596
  #       [network]
  #       tcpport = 1433
  # arbiter:
  #   resources:
  #     limits:
  #       memory: 256Mi
  #     requests:
  #       cpu: 200m
  #       memory: 256Mi
  #       storage: 5Gi
  topology:
    mode: AvailabilityGroup
    availabilityGroup: 
      databases:
        - agdb
        - mssql
      secondaryAccessMode: "All"
  tls:
    issuerRef:
      name: mssqlserver-ca-issuer
      kind: Issuer
      apiGroup: "cert-manager.io"
    clientTLS: false
  monitor:
    agent: prometheus.io/operator
    prometheus:
      exporter:
        port: 9399
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
      serviceMonitor:
        labels:
          release: prometheus
        interval: 10s

  # serviceTemplates:
  # - alias: primary
  #   spec:
  #     type: LoadBalancer
      # ports:
      #   - name: primary
      #     port: 1433            # the port inside the cluster
      #     targetPort: 1433      # forwards to the pod’s container port 1433
      #     protocol: TCP
  # - alias: secondary
  #   spec:
  #     type: NodePort
  #     ports:
  #       - name: secondary
  #         port: 1433
  #         nodePort: 300006
  podTemplate:
    spec:
      containers:
      - name: mssql
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_PID
          value: Evaluation
        resources:
          requests:
            cpu: "1.5"


      - name: mssql-coordinator
        env:
        - name: GODEBUG
          value: "x509negativeserial=1"
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 200m
            memory: 256Mi
  # serviceTemplates:
  # - alias: primary
  #   spec:
  #     type: ClusterIP
  #     ports:
  #       - name: endpoint
  #         port: 5022
  # init:
  #   script:
  #     configMap:
  #       name: mssql-init-scripts
  storageType: Durable
  storage:
    # storageClassName: "longhorn"
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  deletionPolicy: WipeOut

  