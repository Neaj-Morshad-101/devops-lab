---
apiVersion: ops.kubedb.com/v1alpha1
kind: MSSQLServerOpsRequest
metadata:
  name: configure-3-remove-and-apply
  namespace: demo
spec:
  type: Reconfigure
  databaseRef:
    name: standalone
  configuration:
    removeCustomConfig: true
    applyConfig:
      mssql.conf: |-
        [memory]
        memorylimitmb = 2096
  timeout: 5m
  apply: IfReady

# only apply:
# mssql.conf: |-
#   [memory]
#   memorylimitmb = 2096

---


apiVersion: ops.kubedb.com/v1alpha1
kind: MSSQLServerOpsRequest
metadata:
  name: configure-4-config-and-apply
  namespace: demo
spec:
  type: Reconfigure
  databaseRef:
    name: standalone
  configuration:
    configSecret:
      name: ms-new-custom-config2
    applyConfig:
      mssql.conf: |-
        [network]
        tcpport = 1433
  timeout: 5m
  apply: IfReady

