apiVersion: ops.kubedb.com/v1alpha1
kind: MSSQLServerOpsRequest
metadata:
  name: configure-1-only-apply
  namespace: demo
spec:
  type: Reconfigure
  databaseRef:
    name: standalone
  configuration:
    applyConfig:
      mssql.conf: |-
        [sqlconnector]
        logginglevel = 0
  timeout: 5m
  apply: IfReady
---


# ➤ kubectl view-secret -n demo standalone-9188a3 -a
# mssql.conf='[language]
# lcid = 1033
# [memory]
# memorylimitmb = 2511
# [network]
# tcpport = 1433
# tlsprotocols = 1.2
# [sqlconnector]
# logginglevel = 0



apiVersion: ops.kubedb.com/v1alpha1
kind: MSSQLServerOpsRequest
metadata:
  name: configure-2-only-config
  namespace: demo
spec:
  type: Reconfigure
  databaseRef:
    name: standalone
  configuration:
    configSecret:
      name: ms-new-custom-config
  timeout: 5m
  apply: IfReady

# ➤ kubectl view-secret -n demo ms-new-custom-config -a
# mssql.conf='[sqlagent]
# enabled = true'


