apiVersion: kubedb.com/v1alpha2
kind: HanaDB
metadata:
  name: hana-standalone
  namespace: demo
spec:
  version: "2.0.82"
  replicas: 1
  storageType: "Durable"
  storage:
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: 64Gi
    # storageClassName: local-path
  # authSecret:
  #   name: hana-cluster-auth
  #   externallyManaged: true
  healthChecker:
    periodSeconds: 90
    timeoutSeconds: 90
    failureThreshold: 1
  configuration:
    inline:
      global.ini: |-
        [memorymanager]
        global_allocation_limit = 8589934592
    