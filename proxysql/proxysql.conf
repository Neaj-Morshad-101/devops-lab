datadir="/var/lib/proxysql"

admin_variables=
{
    admin_credentials="admin:admin"
    mysql_ifaces="0.0.0.0:6032"
    web_enabled=true
    web_port=6080

    refresh_interval=2000
    cluster_username="cluster1"
    cluster_password="clusterpass"

    stats_credentials="stats:statspass"
}

mysql_variables=
{
    threads=4
    max_connections=4096

    default_query_delay=0
    default_query_timeout=36000000

    poll_timeout=2000

    interfaces="0.0.0.0:6033"

    default_schema="information_schema"

    stacksize=1048576

    server_version="8.0.36"

    connect_timeout_server=3000
    monitor_history=600000

    monitor_connect_interval=2000
    monitor_ping_interval=10000
    monitor_read_only_interval=1500

    monitor_read_only_timeout=500

    ping_interval_server_msec=120000
    ping_timeout_server=500

    commands_stats=true
    sessions_sort=true

    monitor_username="monitor"
    monitor_password="monitorpass"

    ssl_p2s_ca="/etc/proxysql/ssl/ca.crt"
    ssl_p2s_cert="/etc/proxysql/ssl/client.crt"
    ssl_p2s_key="/etc/proxysql/ssl/client.key"

    ssl_p2s_cipher="ECDHE-RSA-AES256-GCM-SHA384"

    query_cache_size_MB=256
    query_cache_stores_empty_result=false

    mysql_query_digests=true
    mysql_query_digests_lowercase=true

    mysql_auditlog_filename="audit.log"
    mysql_auditlog_filesize=104857600

    log_unhealthy_connections=true
}

# ----------------------------------------------------
# Backend MySQL servers
# ----------------------------------------------------

mysql_servers =
(
    {
        address="10.0.0.10"
        port=3306
        hostgroup=10
        max_connections=200
    },
    {
        address="10.0.0.11"
        port=3306
        hostgroup=20
        max_connections=200
    },
    {
        address="10.0.0.12"
        port=3306
        hostgroup=20
        max_connections=200
    }
)

# ----------------------------------------------------
# MySQL users
# ----------------------------------------------------

mysql_users =
(
    {
        username = "appuser"
        password = "app_pass"

        default_hostgroup = 10

        transaction_persistent = 1
        active = 1

        max_connections = 1000

        fast_forward = 0

        frontend = 1
        backend = 1

        comment = "application user"
    }
)

# ----------------------------------------------------
# Query rules
# ----------------------------------------------------

mysql_query_rules =
(
    {
        rule_id=1
        active=1

        match_digest="^SELECT.*"

        destination_hostgroup=20

        apply=1

        comment="route SELECT to replicas"
    },

    {
        rule_id=2
        active=1

        match_digest="^SELECT.*FOR UPDATE"

        destination_hostgroup=10

        apply=1

        comment="SELECT FOR UPDATE goes to primary"
    },

    {
        rule_id=3
        active=1

        match_digest="^INSERT|^UPDATE|^DELETE"

        destination_hostgroup=10

        apply=1

        comment="writes go to primary"
    }
)

# ----------------------------------------------------
# Replication hostgroups
# ----------------------------------------------------

mysql_replication_hostgroups=
(
    {
        writer_hostgroup=10
        reader_hostgroup=20

        comment="main replication setup"
    }
)

# ----------------------------------------------------
# Scheduler example
# ----------------------------------------------------

scheduler=
(
    {
        id=1
        active=0
        interval_ms=10000

        filename="/usr/local/bin/custom-healthcheck.sh"

        arg1="clusterA"

        comment="custom scheduler task"
    }
)

# ----------------------------------------------------
# ProxySQL clustering
# ----------------------------------------------------

proxysql_servers =
(
    {
        hostname="10.0.0.20"
        port=6032
        weight=1
        comment="proxysql-node-1"
    },

    {
        hostname="10.0.0.21"
        port=6032
        weight=1
        comment="proxysql-node-2"
    }
)