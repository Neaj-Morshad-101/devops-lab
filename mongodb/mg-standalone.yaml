apiVersion: kubedb.com/v1alpha2
kind: MongoDB
metadata:
  name: mg-standalone
  namespace: demo
spec:
  storage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
    # storageClassName: standard
  storageType: Durable
  terminationPolicy: WipeOut
  version: 8.0.17
